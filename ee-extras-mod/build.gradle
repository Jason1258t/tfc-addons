plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'ee.extras'
base { archivesName = 'ee-extras' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Проверочный мод (только для runServer): собирает цепи с выпрямителями командой /rectest. В jar не попадает.
sourceSets {
    devtest {
        // Проверка PET нужна только с Destroy (DESTROY=1 ./libs.sh): без его jar класс не компилируем
        if (!file('libs').list()?.any { it.startsWith('destroy-') }) java.exclude '**/PetTest.java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    devtestCompileOnly.extendsFrom compileOnly
}

neoForge {
    version = project.neo_version
    mods {
        ee_extras { sourceSet sourceSets.main }
        ee_extras_devtest { sourceSet sourceSets.devtest }
    }
    addModdingDependenciesTo(sourceSets.devtest)
    // Проверочный сервер: ./gradlew runServer. Create и Electro Energetics кладёт в run/mods скрипт test-server.sh
    runs {
        client {
            client()
            sourceSet = sourceSets.devtest
        }
        server {
            server()
            programArgument '--nogui'
            sourceSet = sourceSets.devtest
        }
    }
}

dependencies {
    // Create, Electro Energetics и их вложенные библиотеки — только для компиляции (libs.sh)
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Уведомление Apache-2.0 для частей, перенесённых из Create: Power Grid (декоративный провод)
jar { from(files('NOTICE', 'LICENSE-PowerGrid')) { into 'META-INF' } }

// Полный проверочный мод для стенда: Gradle сначала компилирует все классы, затем упаковывает их.
tasks.register('devtestJar', Jar) {
    dependsOn tasks.named('devtestClasses')
    archiveClassifier = 'devtest'
    from sourceSets.devtest.output
}

// Проверка проектов плат без игры: штатные validate/compile, карта, цепи выводов, проверенные NBT в build/pcb-check.
// ./gradlew pcbCheck — все демонстрации; -Ppcb=connector — по части имени; -Ppcb=путь.nbt|.snbt — свой проект.
tasks.register('pcbCheck', JavaExec) {
    dependsOn tasks.named('devtestClasses')
    classpath = sourceSets.devtest.runtimeClasspath + fileTree(dir: 'libs', include: '*.jar')
    mainClass = 'ee.extras.devtest.PcbCheck'
    def project = providers.gradleProperty('pcb').map { file(it).exists() ? file(it).absolutePath : it }
    argumentProviders.add({ [layout.buildDirectory.dir('pcb-check').get().asFile.path] + (project.getOrNull() ?: []) } as CommandLineArgumentProvider)
}
