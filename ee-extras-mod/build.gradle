plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'ee.extras'
base { archivesName = 'ee-extras' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def libsList = file('libs').list() ?: []
def hasDestroy = libsList.any { it.startsWith('destroy-') }
def hasComputerCraft = libsList.any { it.toLowerCase().startsWith('computercraft-') || it.toLowerCase().startsWith('cc-') }

// Проверочный мод (только для runServer): собирает цепи с выпрямителями командой /rectest. В jar не попадает.
sourceSets {
    main {
        if (!hasComputerCraft) {
            java.exclude '**/mixin/DiskRecipeMixin.java'
            java.exclude '**/mixin/UpgradeManagerMixin.java'
            java.exclude '**/mixin/ServerComputerPowerMixin.java'
            java.exclude '**/mixin/PocketComputerPowerMixin.java'
        }
        // Thermometer требует официальный TFC (net.dries007.tfc), а в сборке используется TFC-Real-World
        // который не содержит нужных классов. Исключаем термометр всегда для локальной сборки.
        java.exclude '**/thermometer/*.java'
    }
    devtest {
        // Общая заготовка клиентской сцены стенда (tools/stand-scene): в jar стенда — по одному devtest за прогон
        java.srcDir '../stand-scene/src'
        // Проверка PET нужна только с Destroy (DESTROY=1 ./libs.sh): без его jar класс не компилируем
        if (!hasDestroy) java.exclude '**/PetTest.java'
        // ComputerCraft тесты требуют ComputerCraft
        if (!hasComputerCraft) {
            java.exclude '**/ComputerCraftTest.java'
            java.exclude '**/ComputerPowerTest.java'
        }
        // ThermometerTest требует официальный TFC
        java.exclude '**/ThermometerTest.java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    devtestCompileOnly.extendsFrom compileOnly
}

neoForge {
    version = project.neo_version
    mods {
        ee_extras { sourceSet sourceSets.main }
        ee_extras_devtest { sourceSet sourceSets.devtest }
    }
    addModdingDependenciesTo(sourceSets.devtest)
    // Проверочный сервер: ./gradlew runServer. Create и Electro Energetics кладёт в run/mods скрипт test-server.sh
    runs {
        client {
            client()
            sourceSet = sourceSets.devtest
        }
        server {
            server()
            programArgument '--nogui'
            sourceSet = sourceSets.devtest
        }
    }
}

dependencies {
    // Create, Electro Energetics и их вложенные библиотеки — только для компиляции (libs.sh)
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Уведомление Apache-2.0 для частей, перенесённых из Create: Power Grid (декоративный провод)
jar { from(files('NOTICE', 'LICENSE-PowerGrid')) { into 'META-INF' } }

// Полный проверочный мод для стенда: Gradle сначала компилирует все классы, затем упаковывает их.
tasks.register('devtestJar', Jar) {
    dependsOn tasks.named('devtestClasses')
    archiveClassifier = 'devtest'
    from sourceSets.devtest.output
}