plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'tfc.destroy.bridge'
base { archivesName = 'destroy-bridge' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Проверочный мод нужен только runServer: команда /destroytest. В release jar он не попадает.
sourceSets {
    devtest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    devtestCompileOnly.extendsFrom compileOnly
}

neoForge {
    version = project.neo_version
    mods {
        destroy_bridge { sourceSet sourceSets.main }
        destroy_bridge_devtest { sourceSet sourceSets.devtest }
    }
    addModdingDependenciesTo(sourceSets.devtest)
    runs {
        server {
            server()
            programArgument '--nogui'
            sourceSet = sourceSets.devtest
        }
    }
}

dependencies {
    // Точные jar сборки и кандидатов копирует libs.sh; упаковывать их в аддон нельзя.
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
