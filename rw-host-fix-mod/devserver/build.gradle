// Проверочный сервер аддона: NeoForge хоста, в run/mods — TFC, Patchouli, TFC Real World и сам аддон (test-server.sh).
// Свой исходник — только проверочный мод с командой /rwtest.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    mods {
        rw_host_fix_devtest { sourceSet sourceSets.main }
    }
    runs {
        server {
            server()
            programArgument '--nogui'
            // JVM_ARGS из test-server.sh — например -Drw_host_fix.coldsweat.disabled=true
            (System.getenv('JVM_ARGS') ?: '').split(' ').findAll { it }.each { jvmArgument it }
        }
    }
}

dependencies {
    // TFC Real World, Cold Sweat и аддон — только для компиляции проверочного мода; на сервер их кладёт test-server.sh
    // Jar сборки — кеш снимка (npm run pack:fetch) или TFC_MODS_DIR
    def packMods = System.getenv('TFC_MODS_DIR') ?: "${System.getenv('TFC_PACK_CACHE') ?: System.getProperty('user.home') + '/.cache/tfc-plans/pack'}/mods"
    compileOnly fileTree(dir: packMods, includes: ['TFC-Real-World-NeoForge-*.jar', 'ColdSweat-*.jar'])
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
