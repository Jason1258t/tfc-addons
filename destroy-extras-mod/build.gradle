plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'tfc.destroy.extras'
base { archivesName = 'destroy-extras' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    devtest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    devtestCompileOnly.extendsFrom compileOnly
}

neoForge {
    version = project.neo_version
    mods {
        destroy_extras { sourceSet sourceSets.main }
        destroy_extras_devtest { sourceSet sourceSets.devtest }
    }
    addModdingDependenciesTo(sourceSets.devtest)
    runs {
        client {
            client()
            gameDirectory = project.file('run-client')
            systemProperty 'fml.earlydisplay', 'false'
            sourceSet = sourceSets.devtest
        }
        server {
            server()
            gameDirectory = project.file(System.getenv('RUN_DIR') ?: 'run')
            programArgument '--nogui'
            sourceSet = sourceSets.devtest
        }
    }
}

dependencies {
    // Destroy, Petrolpark, Create и destroy_bridge — только для компиляции.
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Jar стенда (не релиз): классы devtest для полной сборки на стенде test1a.
tasks.register('devtestJar', Jar) {
    archiveClassifier = 'devtest'
    from sourceSets.devtest.output
}
