plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'debug.tools'
base { archivesName = 'debug-tools' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Диагностика регистрации — отдельный jar стенда; в публикуемый аддон не входит.
sourceSets { devtest {} }
configurations { devtestCompileOnly.extendsFrom compileOnly }

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.devtest)
    mods {
        debug_tools { sourceSet sourceSets.main }
        registrate_audit { sourceSet sourceSets.devtest }
    }
}

dependencies {
    // TFC — только для компиляции (libs.sh)
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.register('devtestJar', Jar) {
    dependsOn tasks.named('devtestClasses')
    archiveClassifier = 'devtest'
    from sourceSets.devtest.output
}
